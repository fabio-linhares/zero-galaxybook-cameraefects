monitor.v4l2.rules = [
  {
    matches = [
      {
        node.name = "~v4l2_input.*video0"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver = 2000
      }
    }
  }
  {
    matches = [
      {
        node.name = "~v4l2_input.*video40"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1950
        priority.driver = 1950
      }
    }
  }
]
